<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossfader | AI DJ Experience</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007BFF'%3E%3Cpath d='M12 3v18M8 7v10M4 11v2M16 7v10M20 11v2' stroke='%23007BFF' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #007BFF;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --bg-grad: linear-gradient(135deg, #050505, #111827, #000000);
            --glass-bg: rgba(25, 25, 35, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --glass-item: rgba(255, 255, 255, 0.03);
            --glow: rgba(0, 123, 255, 0.15);
        }

        .theme-light {
            --text: #1a1a1a;
            --text-dim: #555555;
            --bg-grad: linear-gradient(135deg, #e6e9f0, #eef1f5);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --glass-item: rgba(255, 255, 255, 0.5);
        }

        .theme-grey {
            --text: #ffffff;
            --text-dim: #b5bac1;
            --bg-grad: linear-gradient(135deg, #2b2d31, #3f4248);
            --glass-bg: rgba(0, 0, 0, 0.2);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --glass-item: rgba(255, 255, 255, 0.05);
            --glow: rgba(255, 255, 255, 0.05);
        }

        body {
            background-image: var(--bg-grad);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0; display: flex; height: 100vh; padding: 20px; gap: 20px;
            overflow: hidden; position: relative; box-sizing: border-box;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, var(--glow) 0%, transparent 70%);
            z-index: -1; transition: background 1s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: var(--glass-shadow);
            transform: translateZ(0); backface-visibility: hidden; will-change: backdrop-filter;     
        }

        /* SIDEBAR */
        .sidebar { width: 320px; display: flex; flex-direction: column; padding: 25px 20px; gap: 15px; z-index: 10; }
        .nav-header { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
        
        .circular-box {
            background: var(--glass-item); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 15px; overflow: hidden;
            transition: all 0.3s ease; cursor: pointer;
        }
        .circular-box h4 { margin: 0; font-size: 14px; font-weight: 600; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;}
        .expand-content { display: none; margin-top: 15px; max-height: 150px; overflow-y: auto; }
        .expand-content.active { display: block; }
        .lib-item { padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 300; margin-bottom: 5px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lib-item:hover { background: var(--glass-item); color: var(--accent); }

        #smart-rec { background: linear-gradient(45deg, var(--accent), #00d4ff); color: #fff; padding: 15px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: none; text-align: center; border: none; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); }

        /* MAIN DASHBOARD */
        .main-view { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; position: relative; justify-content: center; }
        .visualizer { width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), transparent); border: 2px solid var(--accent); margin-bottom: 25px; }
        .playing-animation { animation: pulse 2s infinite alternate ease-in-out; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 15px var(--accent); } 100% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 50px var(--accent); } }
        
        .waveform { display: flex; gap: 5px; height: 35px; align-items: flex-end; margin-bottom: 25px; opacity: 0; transition: 0.3s; }
        .waveform.active { opacity: 1; }
        .bar { width: 6px; background: var(--accent); border-radius: 3px; height: 5px; transition: height 0.1s ease; }

        .search-area { width: 100%; max-width: 550px; display: flex; gap: 10px; margin-top: 25px; z-index: 5; }
        input[type="text"] { background: var(--glass-item); border: 1px solid var(--glass-border); color: var(--text); padding: 15px 20px; border-radius: 25px; outline: none; width: 100%; font-size: 15px; font-family: 'Outfit', sans-serif; backdrop-filter: blur(5px); }
        button { background: var(--accent); color: #fff; border: none; font-family: 'Outfit', sans-serif; padding: 15px 25px; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .results-container { width:100%; max-width:550px; margin-top:20px; overflow-y: auto; max-height: 250px; z-index: 5; }

        /* VIDEO CANVAS */
        .video-canvas { width: 320px; padding: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .player-wrapper { width: 100%; height: 420px; border-radius: 20px; overflow: hidden; position: relative; background: #000; }
        #player-a, #player-b { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: opacity 0.5s ease; pointer-events: none;}
        .hidden { opacity: 0; }

        .like-circle-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--glass-item); border: 1px solid var(--glass-border); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; margin: 10px auto 0; }
        .like-circle-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .like-circle-btn:hover { color: var(--accent); transform: scale(1.1); box-shadow: 0 0 20px rgba(0, 123, 255, 0.4); }

        /* SETTINGS */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .popup { width: 380px; position: relative; padding: 30px; overflow: visible; }
        .close-btn { position: absolute; top: 20px; right: 25px; cursor: pointer; font-size: 24px; color: var(--text-dim); }
        select { appearance: none; background-color: #1a1a1a !important; color: white; cursor: pointer; padding: 15px 20px; border-radius: 25px; border: 1px solid var(--glass-border); outline: none; width: 100%; font-family: 'Outfit', sans-serif; }

        .hotkeys { position: absolute; bottom: 25px; color: var(--text-dim); font-size: 12px; font-weight: 300; }
        kbd { background: var(--glass-item); border: 1px solid var(--glass-border); padding: 4px 8px; border-radius: 6px; color: var(--accent); font-family: monospace;}
    </style>
</head>
<body class="theme-dark">

    <div class="sidebar glass-panel">
        <div class="nav-header">CROSSFADER</div>
        <div class="circular-box" onclick="toggleExpand('liked-content')">
            <h4>Liked <span id="liked-count" style="color:var(--accent)">0</span></h4>
            <div id="liked-content" class="expand-content"></div>
        </div>
        <div id="smart-rec" onclick="triggerSmartSearch()">Explore More</div>
        <div class="circular-box" onclick="toggleExpand('history-content')">
            <h4>History</h4>
            <div id="history-content" class="expand-content"></div>
        </div>
        <div style="margin-top: auto; display: flex; gap: 10px;">
            <button style="flex: 1; font-size: 11px;" onclick="exportPlaylist()">Export</button>
            <button style="flex: 1; font-size: 11px;" onclick="document.getElementById('import-input').click()">Import</button>
            <input type="file" id="import-input" style="display:none" onchange="importPlaylist(event)">
        </div>
        <button style="width:100%;" onclick="toggleSettings(true)">Settings</button>
    </div>

    <div class="main-view glass-panel">
        <div style="position: absolute; top: 30px; right: 40px; font-weight: 600; font-size: 14px; color: var(--accent);">
            User: <span id="display-name" style="color: var(--text)">Unknown</span>
        </div>
        <div class="visualizer" id="visualizer"></div>
        <div class="waveform" id="waveform">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <h2 id="track-name" style="text-align:center; font-weight:800; font-size:26px;">Audio Engine Ready</h2>
        <div class="search-area">
            <input type="text" id="search-input" placeholder="Search for tracks..." onkeydown="if(event.key==='Enter') search()">
            <button onclick="search()" id="search-btn">Search</button>
        </div>
        <div id="results" class="results-container"></div>
        <div class="hotkeys">
            <kbd>Space</kbd> Play/Pause • <kbd>L</kbd> Like • <kbd>F</kbd> Crossfade
        </div>
    </div>

    <div class="video-canvas glass-panel">
        <div class="player-wrapper">
            <div id="player-a"></div>
            <div id="player-b" class="hidden"></div>
        </div>
        <button class="like-circle-btn" onclick="likeCurrent()" title="Like">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
        </button>
    </div>

    <div class="overlay" id="settings-overlay">
        <div class="popup glass-panel">
            <span class="close-btn" onclick="toggleSettings(false)">×</span>
            <h3 style="color: var(--accent); font-weight: 800;">Settings</h3>
            <p style="font-size: 13px; color: var(--text-dim);">Profile Name</p>
            <input type="text" id="name-input" onchange="saveName()" style="margin-bottom:20px; width:100%; box-sizing:border-box;">
            <p style="font-size: 13px; color: var(--text-dim);">Theme</p>
            <select id="theme-select" onchange="changeTheme(this.value)">
                <option value="theme-dark">Dark Glass</option>
                <option value="theme-light">Frosted Light</option>
                <option value="theme-grey">Smoked Grey</option>
            </select>
            <button onclick="hardResetData()" style="width:100%; background:rgba(255,68,68,0.7); margin-top:25px;">Factory Reset</button>
        </div>
    </div>

    <script>
        const CROSSFADE_DURATION = 7;
        let playerA, playerB, activeStr = 'A', currentTrack = null, playlistQueue = [], isCrossfading = false, waveInterval, monitorInterval, isPlaying = false;
        const vibeColors = ['rgba(0,123,255,0.25)', 'rgba(255,0,85,0.2)', 'rgba(0,255,136,0.2)', 'rgba(138,43,226,0.25)', 'rgba(255,165,0,0.2)'];

        function initSystem() {
            let savedUser = localStorage.getItem('cf_user');
            if(!savedUser || savedUser.toLowerCase() === 'shanmugam') savedUser = 'Unknown';
            localStorage.setItem('cf_user', savedUser);
            document.getElementById('display-name').innerText = savedUser;
            document.getElementById('name-input').value = savedUser;
            const t = localStorage.getItem('cf_theme') || 'theme-dark';
            document.body.className = t; document.getElementById('theme-select').value = t;
            renderLists(); generateSmartRec(); setupHotkeys();
        }

        async function search(forceQuery = null) {
            const q = forceQuery || document.getElementById('search-input').value;
            if(!q) return;
            const btn = document.getElementById('search-btn');
            btn.innerText = "Connecting...";
            let data = null;
            
            // Triple-Layer Failover System
            const proxies = [
                `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=videos`,
                `https://pipedapi.drgns.space/search?q=${encodeURIComponent(q)}&filter=videos`,
                `https://iv.melmac.space/api/v1/search?q=${encodeURIComponent(q)}&type=video`
            ];

            for (let url of proxies) {
                try {
                    const res = await fetch(url);
                    const json = await res.json();
                    data = json.content ? json.content.filter(i => i.type === 'stream') : json;
                    if(data && data.length > 0) break;
                } catch(e) { console.log("Proxy failed, retrying..."); }
            }

            if(!data || data.length === 0) {
                alert("All search proxies are currently busy. Try again in 5 seconds.");
                btn.innerText = "Search"; return;
            }

            const target = document.getElementById('results');
            target.innerHTML = '';
            playlistQueue = data.slice(0, 10).map(i => ({ id: i.videoId || i.id, title: i.title }));
            playlistQueue.forEach((item, idx) => {
                const d = document.createElement('div');
                d.className = 'lib-item'; d.style.background = 'var(--glass-item)'; d.style.padding = '12px'; d.style.marginBottom = '8px';
                d.innerHTML = `<strong>${item.title}</strong>`;
                d.onclick = () => playEngine(idx);
                target.appendChild(d);
            });
            btn.innerText = "Search";
        }

        function playEngine(idx) {
            currentTrack = playlistQueue[idx];
            updateUI(currentTrack.title); updateHistory(currentTrack.title, currentTrack.id);
            let active = activeStr === 'A' ? playerA : playerB;
            active.loadVideoById(currentTrack.id); active.setVolume(100);
            isPlaying = true; isCrossfading = false;
            startMonitoring(idx);
        }

        function startMonitoring(idx) {
            clearInterval(monitorInterval);
            monitorInterval = setInterval(() => {
                if(isCrossfading) return;
                let active = activeStr === 'A' ? playerA : playerB;
                try {
                    let rem = active.getDuration() - active.getCurrentTime();
                    if(rem > 0 && rem <= CROSSFADE_DURATION && playlistQueue[idx+1]) executeCrossfade(idx+1);
                } catch(e) {}
            }, 500);
        }

        function executeCrossfade(nextIdx) {
            isCrossfading = true; currentTrack = playlistQueue[nextIdx];
            updateUI(currentTrack.title); updateHistory(currentTrack.title, currentTrack.id);
            let outP = activeStr === 'A' ? playerA : playerB, inP = activeStr === 'A' ? playerB : playerA;
            let outD = document.getElementById(`player-${activeStr.toLowerCase()}`), inD = document.getElementById(`player-${activeStr === 'A'?'b':'a'}`);
            inP.loadVideoById(currentTrack.id); inP.playVideo();
            inD.classList.remove('hidden'); outD.classList.add('hidden');
            let steps = 20, cur = 0;
            let fade = setInterval(() => {
                cur++; let vol = Math.floor((cur/steps)*100);
                inP.setVolume(vol); outP.setVolume(100-vol);
                if(cur>=steps) { clearInterval(fade); outP.stopVideo(); activeStr = activeStr==='A'?'B':'A'; isCrossfading=false; startMonitoring(nextIdx); }
            }, (CROSSFADE_DURATION*1000)/steps);
        }

        function onYouTubeIframeAPIReady() {
            const vars = {controls:0, disablekb:1, rel:0, modestbranding:1};
            playerA = new YT.Player('player-a', {playerVars: vars});
            playerB = new YT.Player('player-b', {playerVars: vars});
        }

        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
        function updateUI(t) { document.getElementById('track-name').innerText = t; document.getElementById('visualizer').classList.add('playing-animation'); document.getElementById('waveform').classList.add('active'); animateWaveform(true); }
        function animateWaveform(p) { clearInterval(waveInterval); if(!p) return; const bars = document.querySelectorAll('.bar'); waveInterval = setInterval(() => bars.forEach(b => b.style.height = Math.random()*30+5+'px'), 150); }
        function toggleExpand(id) { document.getElementById(id).classList.toggle('active'); }
        function toggleSettings(s) { document.getElementById('settings-overlay').style.display = s?'flex':'none'; }
        function saveName() { const v = document.getElementById('name-input').value || 'Unknown'; localStorage.setItem('cf_user', v); document.getElementById('display-name').innerText = v; }
        function changeTheme(t) { document.body.className = t; localStorage.setItem('cf_theme', t); }
        function likeCurrent() { if(!currentTrack) return; let l = JSON.parse(localStorage.getItem('cf_l')) || []; if(!l.find(i=>i.id===currentTrack.id)) { l.unshift(currentTrack); localStorage.setItem('cf_l', JSON.stringify(l)); renderLists(); } }
        function updateHistory(t, id) { let h = JSON.parse(localStorage.getItem('cf_h')) || []; h = h.filter(i=>i.id!==id); h.unshift({title:t, id}); localStorage.setItem('cf_h', JSON.stringify(h.slice(0,20))); renderLists(); }
        function renderLists() { const l = JSON.parse(localStorage.getItem('cf_l')) || [], h = JSON.parse(localStorage.getItem('cf_h')) || []; document.getElementById('liked-count').innerText = l.length; const s = (st)=>st.replace(/'/g,"\\'"); document.getElementById('liked-content').innerHTML = l.map(i=>`<div class="lib-item" onclick="playEngineSingle('${i.id}','${s(i.title)}')">${i.title}</div>`).join(''); document.getElementById('history-content').innerHTML = h.map(i=>`<div class="lib-item" onclick="playEngineSingle('${i.id}','${s(i.title)}')">${i.title}</div>`).join(''); }
        function playEngineSingle(id, t) { playlistQueue = [{id, title:t}]; playEngine(0); }
        function exportPlaylist() { const d = {l:localStorage.getItem('cf_l'), h:localStorage.getItem('cf_h')}; const b = new Blob([JSON.stringify(d)],{type:'application/json'}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href=u; a.download='crossfader.json'; a.click(); }
        function importPlaylist(e) { const r = new FileReader(); r.onload=(ev)=>{ const d=JSON.parse(ev.target.result); localStorage.setItem('cf_l',d.l); localStorage.setItem('cf_h',d.h); renderLists(); }; r.readAsText(e.target.files[0]); }
        function hardResetData() { if(confirm("Reset all data?")) { localStorage.clear(); window.location.reload(); } }
        function setupHotkeys() { document.addEventListener('keydown', (e) => { if(document.activeElement.tagName==='INPUT') return; let ap = activeStr==='A'?playerA:playerB; if(e.key===' ') { e.preventDefault(); if(isPlaying) { ap.pauseVideo(); isPlaying=false; animateWaveform(false); } else { ap.playVideo(); isPlaying=true; animateWaveform(true); } } if(e.key==='l') likeCurrent(); }); }
        window.onload = initSystem;
    </script>
</body>
</html>
