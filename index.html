<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossfader | AI DJ Experience</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007BFF'%3E%3Cpath d='M12 3v18M8 7v10M4 11v2M16 7v10M20 11v2' stroke='%23007BFF' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #007BFF;
            --accent-glow: #00d4ff;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --bg-grad: linear-gradient(135deg, #050505, #111827, #000000);
            --glass-bg: rgba(25, 25, 35, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow: rgba(0, 123, 255, 0.15);
        }

        body {
            background-image: var(--bg-grad); color: var(--text); font-family: 'Outfit', sans-serif;
            margin: 0; display: flex; height: 100vh; padding: 20px; gap: 20px; overflow: hidden; box-sizing: border-box;
        }

        body::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--glow) 0%, transparent 70%);
            z-index: -1;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateZ(0); backface-visibility: hidden;
        }

        /* INITIAL OVERLAY */
        #init-overlay {
            position: fixed; inset: 0; z-index: 10000; background: var(--bg-grad);
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        /* SIDEBAR */
        .sidebar { width: 300px; display: flex; flex-direction: column; padding: 25px 20px; gap: 15px; flex-shrink: 0; }
        .nav-header { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
        .circular-box { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; cursor: pointer; }
        .expand-content { display: none; margin-top: 15px; max-height: 150px; overflow-y: auto; }
        .expand-content.active { display: block; }
        .lib-item { padding: 8px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lib-item:hover { background: rgba(255,255,255,0.05); color: var(--accent); }

        /* MAIN VIEW */
        .main-view { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .visualizer-container { width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
        .visualizer { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--accent); background: linear-gradient(135deg, var(--accent), transparent); transition: 0.5s; }
        .playing-animation { animation: pulse 2s infinite alternate ease-in-out; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); box-shadow: 0 0 30px var(--accent); } }

        .waveform { display: flex; gap: 5px; height: 40px; align-items: flex-end; position: absolute; opacity: 0; transition: 0.3s; pointer-events: none; }
        .waveform.active { opacity: 1; }
        .bar { width: 6px; background: var(--accent); border-radius: 3px; height: 5px; transition: height 0.1s; }

        button {
            background: linear-gradient(45deg, var(--accent), var(--accent-glow)); color: #fff; border: none; padding: 14px 30px; 
            border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Outfit';
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4); }

        .search-area { width: 100%; max-width: 500px; display: flex; gap: 10px; margin-top: 25px; }
        input[type="text"] { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 15px; border-radius: 25px; outline: none; width: 100%; font-family: 'Outfit'; }
        
        .progress-container { width: 100%; max-width: 500px; margin-top: 20px; display: flex; align-items: center; gap: 10px; }
        #seek-bar { flex-grow: 1; accent-color: var(--accent); cursor: pointer; }

        /* CANVAS */
        .video-canvas { width: 300px; padding: 20px; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        .player-wrapper { width: 100%; height: 450px; border-radius: 20px; overflow: hidden; background: #000; position: relative; }
        #player-a, #player-b { position: absolute; top: 0; left: -38.5%; width: 177%; height: 100%; transition: opacity 0.8s ease-in-out; }
        .hidden { opacity: 0; pointer-events: none; }

        .like-btn { width: 55px; height: 55px; border-radius: 50%; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 10px auto; transition: 0.3s; }
        .like-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .popup { width: 340px; padding: 30px; }
    </style>
</head>
<body class="theme-dark">

    <div id="init-overlay">
        <h1 style="font-weight: 800; letter-spacing: 4px; color: var(--accent);">CROSSFADER</h1>
        <p style="color: var(--text-dim); margin-bottom: 30px;">Click below to initialize high-fidelity audio engine</p>
        <button onclick="startApp()" style="font-size: 18px;">START AUDIO ENGINE</button>
    </div>

    <div class="sidebar glass-panel">
        <div class="nav-header">CROSSFADER</div>
        <div class="circular-box" onclick="toggleExpand('liked-content')">
            <h4>Liked <span id="liked-count" style="color:var(--accent)">0</span></h4>
            <div id="liked-content" class="expand-content"></div>
        </div>
        <div class="circular-box" onclick="toggleExpand('history-content')">
            <h4>History</h4>
            <div id="history-content" class="expand-content"></div>
        </div>
        <button onclick="toggleSettings(true)" style="margin-top: auto; background: rgba(255,255,255,0.05); color: #fff;">Settings</button>
    </div>

    <div class="main-view glass-panel">
        <div style="position: absolute; top: 30px; right: 40px; color: var(--accent); font-weight: 600;">
            User: <span id="display-name" style="color:#fff">Unknown</span>
        </div>
        
        <div class="visualizer-container">
            <div class="visualizer" id="visualizer"></div>
            <div class="waveform" id="waveform">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <h2 id="track-name" style="text-align:center; margin: 20px 0 5px; font-weight: 800; font-size: 28px;">Engine Ready</h2>
        
        <div class="progress-container">
            <span id="cur-time" style="font-size: 12px; min-width: 35px;">0:00</span>
            <input type="range" id="seek-bar" value="0">
            <span id="total-dur" style="font-size: 12px; min-width: 35px;">0:00</span>
        </div>

        <div class="search-area">
            <input type="text" id="search-input" placeholder="Search (Data Saver Active)..." onkeydown="if(event.key==='Enter') search()">
            <button onclick="search()" id="search-btn">Search</button>
        </div>
        <div id="results" style="width:100%; max-width:500px; margin-top:15px; overflow-y:auto; flex-grow:1;"></div>
    </div>

    <div class="video-canvas glass-panel">
        <div class="player-wrapper">
            <div id="player-a"></div>
            <div id="player-b" class="hidden"></div>
        </div>
        <button class="like-btn" onclick="likeCurrent()">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
        </button>
    </div>

    <div class="overlay" id="settings-overlay">
        <div class="popup glass-panel">
            <h3 style="color:var(--accent); margin-top:0;">Profile Settings</h3>
            <input type="text" id="name-input" placeholder="Enter Name" style="width:100%; box-sizing:border-box; margin-bottom:15px;">
            <button onclick="saveName()" style="width:100%;">Save</button>
            <button onclick="toggleSettings(false)" style="width:100%; margin-top:10px; background:none; border:1px solid #444;">Close</button>
        </div>
    </div>

    <script>
        let playerA, playerB, activePlayer = 'A', isPlaying = false, isFading = false;
        let playlistQueue = [], currentTrackIndex = 0;
        let waveInt, seekInt, crossfadeMonitor;

        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const vars = {controls:0, disablekb:1, rel:0, modestbranding:1, iv_load_policy:3, vq:'tiny', origin: window.location.origin};
            playerA = new YT.Player('player-a', {playerVars: vars, events: { 'onStateChange': onState }});
            playerB = new YT.Player('player-b', {playerVars: vars, events: { 'onStateChange': onState }});
        }

        function startApp() {
            document.getElementById('init-overlay').style.display = 'none';
            // Secret trick: play a silent second to "warm up" the audio context
            playerA.cueVideoById('3000'); 
            playerB.cueVideoById('3000');
        }

        function onState(e) {
            if (e.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('visualizer').style.opacity = '0';
                document.getElementById('waveform').classList.add('active');
                startWave(true); startSeek();
                e.target.setPlaybackQuality('tiny'); 
            } else if (e.data === YT.PlayerState.ENDED) {
                if(!isFading) playNext();
            } else {
                isPlaying = false;
                document.getElementById('visualizer').style.opacity = '1';
                document.getElementById('waveform').classList.remove('active');
                startWave(false);
            }
        }

        async function search() {
            const q = document.getElementById('search-input').value;
            if(!q) return;
            const btn = document.getElementById('search-btn');
            btn.innerText = "Finding...";
            
            const gateways = [
                `https://pipedapi.lunar.icu/search?q=${encodeURIComponent(q + " audio")}&filter=videos`,
                `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q + " audio")}&filter=videos`,
                `https://iv.melmac.space/api/v1/search?q=${encodeURIComponent(q + " audio")}&type=video`
            ];

            let data = null;
            for (let url of gateways) {
                try {
                    const res = await fetch(url);
                    const json = await res.json();
                    data = json.content ? json.content.filter(i => i.type === 'stream') : (json.items || json);
                    if(data && data.length > 0) break;
                } catch(e) {}
            }

            if(!data) { alert("Try another song."); btn.innerText = "Search"; return; }

            const target = document.getElementById('results'); target.innerHTML = '';
            playlistQueue = data.slice(0, 8).map(i => ({ id: i.videoId || i.id, title: i.title }));
            
            playlistQueue.forEach((item, idx) => {
                const d = document.createElement('div');
                d.className = 'lib-item'; d.style.background = 'rgba(255,255,255,0.03)';
                d.innerHTML = `<strong>${item.title}</strong>`;
                d.onclick = () => play(idx);
                target.appendChild(d);
            });
            btn.innerText = "Search";
            play(0);
        }

        function play(idx) {
            isFading = false;
            currentTrackIndex = idx;
            const track = playlistQueue[idx];
            document.getElementById('track-name').innerText = track.title;
            
            let p = activePlayer === 'A' ? playerA : playerB;
            p.loadVideoById({videoId: track.id, suggestedQuality: 'tiny'});
            p.setVolume(100);
            
            addHistory(track);
            startCrossfadeMonitor();
        }

        function startCrossfadeMonitor() {
            clearInterval(crossfadeMonitor);
            crossfadeMonitor = setInterval(() => {
                let p = activePlayer === 'A' ? playerA : playerB;
                if(p && p.getDuration && !isFading) {
                    let timeLeft = p.getDuration() - p.getCurrentTime();
                    if(timeLeft <= 7 && timeLeft > 0 && playlistQueue[currentTrackIndex + 1]) {
                        runCrossfade();
                    }
                }
            }, 1000);
        }

        function runCrossfade() {
            isFading = true;
            let nextIdx = currentTrackIndex + 1;
            let outP = activePlayer === 'A' ? playerA : playerB;
            let inP = activePlayer === 'A' ? playerB : playerA;
            
            activePlayer = (activePlayer === 'A') ? 'B' : 'A';
            currentTrackIndex = nextIdx;
            
            const track = playlistQueue[nextIdx];
            document.getElementById('track-name').innerText = track.title;
            
            // Switch UI
            document.getElementById('player-a').classList.toggle('hidden');
            document.getElementById('player-b').classList.toggle('hidden');
            
            inP.loadVideoById({videoId: track.id, suggestedQuality: 'tiny'});
            inP.setVolume(0);
            inP.playVideo();

            let vol = 0;
            let fade = setInterval(() => {
                vol += 5;
                inP.setVolume(vol);
                outP.setVolume(100 - vol);
                if(vol >= 100) {
                    clearInterval(fade);
                    outP.stopVideo();
                    isFading = false;
                    addHistory(track);
                }
            }, 300);
        }

        function playNext() { if(currentTrackIndex + 1 < playlistQueue.length) play(currentTrackIndex + 1); }

        function startSeek() {
            clearInterval(seekInt);
            seekInt = setInterval(() => {
                let p = activePlayer === 'A' ? playerA : playerB;
                if(p && p.getCurrentTime) {
                    let c = p.getCurrentTime(), d = p.getDuration();
                    document.getElementById('seek-bar').max = d;
                    document.getElementById('seek-bar').value = c;
                    document.getElementById('cur-time').innerText = fmt(c);
                    document.getElementById('total-dur').innerText = fmt(d);
                }
            }, 1000);
        }

        document.getElementById('seek-bar').oninput = function() {
            (activePlayer === 'A' ? playerA : playerB).seekTo(this.value);
        };

        function fmt(s) { let m = Math.floor(s/60), sc = Math.floor(s%60); return m+":"+(sc<10?"0"+sc:sc); }
        function startWave(p) { clearInterval(waveInt); if(p) waveInt = setInterval(() => document.querySelectorAll('.bar').forEach(b => b.style.height = Math.random()*35+5+'px'), 150); }
        function toggleExpand(id) { document.getElementById(id).classList.toggle('active'); }
        function toggleSettings(s) { document.getElementById('settings-overlay').style.display = s?'flex':'none'; }
        function saveName() { localStorage.setItem('cf_user', document.getElementById('name-input').value); location.reload(); }
        function addHistory(t) {
            let h = JSON.parse(localStorage.getItem('cf_h') || '[]');
            h = [t, ...h.filter(x => x.id !== t.id)].slice(0, 10);
            localStorage.setItem('cf_h', JSON.stringify(h));
            render();
        }
        function likeCurrent() {
            const t = playlistQueue[currentTrackIndex]; if(!t) return;
            let l = JSON.parse(localStorage.getItem('cf_l') || '[]');
            if(!l.find(x => x.id === t.id)) { l.push(t); localStorage.setItem('cf_l', JSON.stringify(l)); render(); }
        }
        function render() {
            const l = JSON.parse(localStorage.getItem('cf_l') || '[]'), h = JSON.parse(localStorage.getItem('cf_h') || '[]');
            document.getElementById('liked-count').innerText = l.length;
            document.getElementById('liked-content').innerHTML = l.map(i => `<div class="lib-item" onclick="playSingle('${i.id}','${i.title.replace(/'/g,"")}')">${i.title}</div>`).join('');
            document.getElementById('history-content').innerHTML = h.map(i => `<div class="lib-item" onclick="playSingle('${i.id}','${i.title.replace(/'/g,"")}')">${i.title}</div>`).join('');
        }
        function playSingle(id, title) { playlistQueue = [{id, title}]; play(0); }
        function hardResetData() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const n = localStorage.getItem('cf_user') || 'Unknown';
            document.getElementById('display-name').innerText = n;
            render();
        };
    </script>
</body>
</html>
