<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossfader | AI DJ Experience</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007BFF'%3E%3Cpath d='M12 3v18M8 7v10M4 11v2M16 7v10M20 11v2' stroke='%23007BFF' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #007BFF;
            --accent-glow: #00d4ff;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --bg-grad: linear-gradient(135deg, #050505, #111827, #000000);
            --glass-bg: rgba(25, 25, 35, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --glass-item: rgba(255, 255, 255, 0.03);
        }

        body {
            background-image: var(--bg-grad); color: var(--text); font-family: 'Outfit', sans-serif;
            margin: 0; display: flex; height: 100vh; padding: 20px; gap: 20px; overflow: hidden; box-sizing: border-box;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: var(--glass-shadow);
        }

        /* SIDEBAR */
        .sidebar { width: 320px; display: flex; flex-direction: column; padding: 25px 20px; gap: 15px; }
        .nav-header { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
        
        /* MAIN DASHBOARD */
        .main-view { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Circular Visualizer Fix */
        .visualizer-container { 
            width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;
        }
        .visualizer { 
            width: 100%; height: 100%; border-radius: 50%; 
            background: linear-gradient(135deg, var(--accent), transparent); 
            border: 2px solid var(--accent); transition: opacity 0.5s; 
        }
        .playing-animation { animation: pulse 2s infinite alternate ease-in-out; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 10px var(--accent); } 100% { transform: scale(1.05); box-shadow: 0 0 30px var(--accent); } }

        .waveform { display: flex; gap: 5px; height: 40px; align-items: flex-end; position: absolute; opacity: 0; pointer-events: none; }
        .waveform.active { opacity: 1; }
        .bar { width: 6px; background: var(--accent); border-radius: 3px; height: 5px; transition: height 0.1s; }

        /* GRADIENT BUTTONS */
        button {
            background: linear-gradient(45deg, var(--accent), var(--accent-glow));
            color: #fff; border: none; font-family: 'Outfit'; padding: 12px 25px; 
            border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5); }

        /* SEARCH & PROGRESS */
        .search-area { width: 100%; max-width: 500px; display: flex; gap: 10px; margin-top: 30px; }
        input[type="text"] { background: var(--glass-item); border: 1px solid var(--glass-border); color: #fff; padding: 15px 20px; border-radius: 25px; outline: none; flex-grow: 1; font-family: 'Outfit'; }

        .progress-container { width: 100%; max-width: 500px; margin-top: 20px; display: flex; align-items: center; gap: 10px; }
        #seek-bar { flex-grow: 1; accent-color: var(--accent); cursor: pointer; }

        /* PORTRAIT VIDEO FIX */
        .video-canvas { width: 320px; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .player-wrapper { width: 100%; height: 450px; border-radius: 20px; overflow: hidden; background: #000; position: relative; }
        #player-a, #player-b { 
            position: absolute; width: 177%; height: 100%; left: -38.5%; /* Centers the wide video in portrait */
            transition: opacity 0.5s; pointer-events: none; 
        }

        .like-btn { 
            width: 55px; height: 55px; border-radius: 50%; border: 1px solid var(--glass-border);
            background: var(--glass-item); color: var(--accent); display: flex; 
            align-items: center; justify-content: center; cursor: pointer; margin: 10px auto; transition: 0.3s;
        }
        .like-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .like-btn:hover { background: var(--accent); color: white; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 9999; justify-content: center; align-items: center; }
        .popup { width: 340px; padding: 30px; }
    </style>
</head>
<body>

    <div class="sidebar glass-panel">
        <div class="nav-header">CROSSFADER</div>
        <button onclick="toggleSettings(true)" style="margin-top: auto;">⚙️ Settings</button>
    </div>

    <div class="main-view glass-panel">
        <div style="position: absolute; top: 30px; right: 40px; color: var(--accent); font-weight: 600;">
            Hi, <span id="display-name" style="color: #fff;">Unknown</span>
        </div>
        
        <div class="visualizer-container">
            <div class="visualizer" id="visualizer"></div>
            <div class="waveform" id="waveform">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <h2 id="track-name" style="text-align:center; margin: 20px 0 5px;">Search to Play</h2>
        
        <div class="progress-container">
            <span id="cur-time" style="font-size: 12px; min-width: 35px;">0:00</span>
            <input type="range" id="seek-bar" value="0">
            <span id="total-dur" style="font-size: 12px; min-width: 35px;">0:00</span>
        </div>

        <div class="search-area">
            <input type="text" id="search-input" placeholder="Artist, song...">
            <button onclick="search()" id="search-btn">Search</button>
        </div>
        <div id="results" style="width:100%; max-width:500px; margin-top:15px; overflow-y:auto; flex-grow: 1;"></div>
    </div>

    <div class="video-canvas glass-panel">
        <div class="player-wrapper">
            <div id="player-a"></div>
            <div id="player-b" class="hidden"></div>
        </div>
        <button class="like-btn" onclick="alert('Liked!')">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
        </button>
    </div>

    <div class="overlay" id="settings-overlay">
        <div class="popup glass-panel">
            <h3 style="color: var(--accent); margin-top: 0;">Settings</h3>
            <input type="text" id="name-input" placeholder="Your Name" style="width: 100%; box-sizing: border-box;">
            <button onclick="saveName()" style="width: 100%; margin-top: 15px;">Apply</button>
        </div>
    </div>

    <script>
        let playerA, playerB, activeStr = 'A', isPlaying = false, waveInt;

        function init() {
            const name = localStorage.getItem('cf_user') || 'Unknown';
            document.getElementById('display-name').innerText = name;
        }

        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const v = {controls:0, disablekb:1, rel:0, modestbranding:1, iv_load_policy:3};
            playerA = new YT.Player('player-a', {playerVars: v, events: { 'onStateChange': onState }});
            playerB = new YT.Player('player-b', {playerVars: v, events: { 'onStateChange': onState }});
        }

        function onState(e) {
            if (e.data === 1) { // Playing
                isPlaying = true;
                document.getElementById('visualizer').style.opacity = '0';
                document.getElementById('waveform').classList.add('active');
                startWave(true);
                updateSeek();
            } else {
                isPlaying = false;
                startWave(false);
            }
        }

        async function search() {
            const q = document.getElementById('search-input').value;
            if(!q) return;
            const btn = document.getElementById('search-btn');
            btn.innerText = "Bypassing...";
            
            let data = null;
            const gateways = [
                `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=videos`,
                `https://invidious.flokinet.to/api/v1/search?q=${encodeURIComponent(q)}&type=video`
            ];

            for (let url of gateways) {
                try {
                    const res = await fetch(url);
                    const json = await res.json();
                    data = json.content ? json.content.filter(i => i.type === 'stream') : json;
                    if(data && data.length > 0) break;
                } catch(e) {}
            }

            const target = document.getElementById('results'); target.innerHTML = '';
            data.slice(0, 6).forEach(item => {
                const d = document.createElement('div');
                d.style = "background:var(--glass-item); padding:12px; border-radius:12px; margin-bottom:8px; cursor:pointer;";
                d.innerHTML = `<strong>${item.title}</strong>`;
                d.onclick = () => {
                    document.getElementById('track-name').innerText = item.title;
                    (activeStr === 'A' ? playerA : playerB).loadVideoById(item.videoId || item.id);
                };
                target.appendChild(d);
            });
            btn.innerText = "Search";
        }

        function updateSeek() {
            setInterval(() => {
                let p = activeStr === 'A' ? playerA : playerB;
                if (p && p.getCurrentTime) {
                    let c = p.getCurrentTime(), d = p.getDuration();
                    document.getElementById('seek-bar').max = d;
                    document.getElementById('seek-bar').value = c;
                    document.getElementById('cur-time').innerText = fmt(c);
                    document.getElementById('total-dur').innerText = fmt(d);
                }
            }, 1000);
        }

        document.getElementById('seek-bar').oninput = function() {
            (activeStr === 'A' ? playerA : playerB).seekTo(this.value);
        };

        function fmt(s) {
            let m = Math.floor(s / 60), sc = Math.floor(s % 60);
            return m + ":" + (sc < 10 ? "0" + sc : sc);
        }

        function startWave(p) {
            clearInterval(waveInt);
            if(p) waveInt = setInterval(() => document.querySelectorAll('.bar').forEach(b => b.style.height = Math.random()*35+5+'px'), 150);
        }

        function saveName() {
            const n = document.getElementById('name-input').value || 'Unknown';
            localStorage.setItem('cf_user', n);
            document.getElementById('display-name').innerText = n;
            toggleSettings(false);
        }

        function toggleSettings(s) { document.getElementById('settings-overlay').style.display = s?'flex':'none'; }

        document.addEventListener('keydown', (e) => {
            if(e.key === ' ' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                let p = activeStr === 'A' ? playerA : playerB;
                isPlaying ? p.pauseVideo() : p.playVideo();
            }
        });

        window.onload = init;
    </script>
</body>
</html>
